{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-icon">🔐</div>
    <h2 style="font-size:1.35rem;font-weight:800;margin-bottom:4px;">Welcome Back</h2>
    <p style="color:var(--muted);font-size:0.88rem;margin-bottom:18px;">Log in to manage your business invoices and bills.</p>

    <form method="POST">
      <div style="margin-bottom:12px;">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@business.co.ke" required>
      </div>
      <div style="margin-bottom:18px;">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
    </form>

    <div class="alert alert-warn" style="margin-top:14px;margin-bottom:0;font-size:0.82rem;">
      Test Account: <strong>test@sme.co.ke</strong> · Password: <strong>1234</strong>
    </div>

    <p style="text-align:center;font-size:0.86rem;color:var(--muted);margin-top:16px;">
      Don't have an account?
      <a href="{{ url_for('signup') }}" style="color:var(--blue);font-weight:700;text-decoration:none;">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
